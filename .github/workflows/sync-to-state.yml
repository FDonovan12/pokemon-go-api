name: Sync to State Branch

on:
    push:
        branches: [main]

jobs:
    sync-state:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Important pour voir toutes les branches

            - name: Setup Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Sync and Push
              run: |
                  # 1. On sauvegarde le hash de main
                  MAIN_HASH=$(git rev-parse HEAD)

                  # 2. On bascule sur la branche state
                  git checkout state

                  # 3. On récupère les fichiers de main sans toucher au dossier .github de state
                  # Cette commande magique extrait les fichiers de main vers l'index de state
                  git checkout main -- .
                  git reset HEAD .github/ # On ne veut PAS importer les workflows de main
                  git checkout .github/   # On restaure les workflows originaux de state

                  # 4. On injecte le hash
                  echo "$MAIN_HASH" > main_source_hash.txt

                  # 5. Commit et Push
                  git add .
                  if [ -n "$(git status --porcelain)" ]; then
                    git commit -m "sync: update from main commit $MAIN_HASH"
                    git push origin state
                  else
                    echo "Aucun changement détecté."
                  fi
