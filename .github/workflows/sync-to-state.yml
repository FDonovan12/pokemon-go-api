name: Sync to State Branch

on:
    push:
        branches: [main]

jobs:
    sync-state:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Sync and Push
              id: sync
              run: |
                  MAIN_HASH=$(git rev-parse --short HEAD)

                  # On va sur state
                  git checkout state
                  git pull origin state

                  # On importe TOUT de main
                  git checkout main -- .

                  # --- PROTECTION DES WORKFLOWS ---
                  # On force la restauration du dossier .github de la branche state
                  # Pour ne pas écraser generate-output.yml par sync-to-state.yml
                  git checkout HEAD -- .github/

                  # Injection du hash
                  echo "$MAIN_HASH" > main_source_hash.txt

                  git add .

                  if [ -n "$(git status --porcelain)" ]; then
                    git commit -m "sync: update code from main ($MAIN_HASH)"
                    git push origin state
                    # Utilisation de la nouvelle méthode GITHUB_OUTPUT
                    echo "run_trigger=true" >> $GITHUB_OUTPUT
                    echo "CHANGES_FOUND=true"
                  else
                    echo "run_trigger=false" >> $GITHUB_OUTPUT
                    echo "CHANGES_FOUND=false"
                  fi

            - name: Trigger State Workflow
              # On utilise une condition basée sur le log précédent si l'output bug
              if: steps.sync.outputs.run_trigger == 'true'
              run: |
                  echo "🚀 Déclenchement du workflow de génération sur state..."
                  # REMPLACE BIEN par le nom de ton fichier sur la branche STATE
                  gh workflow run generate-output.yml --ref state
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
