name: Sync to State Branch

on:
    push:
        branches: [main]

jobs:
    sync-state:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout main
              uses: actions/checkout@v4
              with:
                  path: main-folder

            - name: Checkout state branch
              uses: actions/checkout@v4
              with:
                  ref: state
                  path: state-folder

            - name: Sync and Inject Hash
              run: |
                  # 1. On vide la branche state sauf .git et .github (ton workflow cron)
                  find state-folder -maxdepth 1 ! -name 'state-folder' ! -name '.git' ! -name '.github' -exec rm -rf {} +

                  # 2. On copie le contenu de main vers state (sans le dossier .github)
                  rsync -av --exclude='.github/' main-folder/ state-folder/

                  # 3. On crée le fichier de hash (ton besoin spécifique)
                  echo "${{ github.sha }}" > main_source_hash.txt

            - name: Commit and Push
              run: |
                  cd state-folder
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .

                  # On commit seulement s'il y a des changements
                  if [ -n "$(git status --porcelain)" ]; then
                    git commit -m "sync: update from main commit ${{ github.sha }}"
                    git push origin state
                  else
                    echo "Aucun changement à synchroniser."
                  fi
