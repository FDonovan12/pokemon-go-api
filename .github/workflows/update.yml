name: Update Game Master

on:
    schedule:
        - cron: '0 */6 * * *' # Toutes les 6 heures
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Configure git
              run: |
                  git config user.name "pogo-bot"
                  git config user.email "bot@users.noreply.github.com"

            - name: Run Update Script
              run: npm run update # Ce script génère tes dossiers data/raw et data/api

            - name: Commit meta timestamp (main)
              run: |
                  if [[ -n $(git status --porcelain meta/) ]]; then
                    git add meta/
                    git commit -m "chore(meta): update last Game Master timestamp"
                    git push origin main
                  else
                    echo "No meta change"
                  fi

            - name: Deploy data to api-dist
              run: |
                  # 1. Vérifier s'il y a des changements dans le dossier data/
                  if [[ -n $(git status --porcelain data/) ]]; then
                    echo "Changes detected in data/, syncing to api-dist..."

                    # 2. Sauvegarder le contenu de data/ dans un dossier temporaire
                    mkdir -p /tmp/api_content
                    cp -r data/* /tmp/api_content/

                    # 3. Préparer la branche api-dist
                    # On récupère l'historique pour pouvoir switcher proprement
                    git fetch origin api-dist || true
                    
                    if git show-ref --verify --quiet refs/remotes/origin/api-dist; then
                      git checkout api-dist
                      # On nettoie TOUT le contenu actuel de la branche pour repartir de zéro
                      # (Sauf le dossier .git)
                      find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
                    else
                      git checkout --orphan api-dist
                      git rm -rf .
                    fi

                    # 4. Copier les nouveaux fichiers depuis le cache
                    cp -r /tmp/api_content/* .

                    # 5. Configurer un .gitignore minimal pour api-dist (optionnel)
                    # Cela évite de repousser des dossiers système si besoin
                    echo "node_modules/" > .gitignore
                    echo ".github/" >> .gitignore

                    # 6. Commit et Push
                    # git add -A permet de prendre en compte les ajouts, modifications ET suppressions
                    git add -A
                    
                    # On vérifie s'il y a vraiment un changement après le nettoyage (au cas où)
                    if git diff --staged --quiet; then
                      echo "No actual changes to commit"
                    else
                      git commit -m "Update Game Master Data - $(date +'%Y-%m-%d %H:%M')"
                      git push origin api-dist
                    fi
                  else
                    echo "No changes in data/"
                  fi
