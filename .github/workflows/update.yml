name: Update Game Master

on:
    schedule:
        - cron: '0 */6 * * *' # Toutes les 6 heures
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Configure git
              run: |
                  git config user.name "pogo-bot"
                  git config user.email "bot@users.noreply.github.com"

            - name: Run Update Script
              run: npm run update # Ce script génère tes dossiers data/raw et data/api

            - name: Commit meta timestamp (main)
              run: |
                  if [[ -n $(git status --porcelain meta/) ]]; then
                    git add meta/
                    git commit -m "chore(meta): update last Game Master timestamp"
                    git push origin main
                  else
                    echo "No meta change"
                  fi

            - name: Deploy data to api-dist
              run: |
                  # 1. Vérifier s'il y a des changements
                  if [[ -n $(git status --porcelain data/) ]]; then
                    echo "Changes detected, starting sync..."

                    # 2. Sauvegarde temporaire du CONTENU de data
                    mkdir -p /tmp/api_content
                    cp -r data/* /tmp/api_content/

                    # 3. NETTOYAGE CRUCIAL
                    # On annule les changements locaux pour permettre le switch de branche
                    git reset --hard HEAD
                    git clean -fd

                    # 4. Préparer la branche api-dist
                    git fetch origin api-dist || true
                    
                    if git show-ref --verify --quiet refs/remotes/origin/api-dist; then
                      git checkout api-dist
                      # On vide la branche api-dist pour refléter exactement le nouveau contenu
                      # (Sauf le dossier .git)
                      find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
                    else
                      git checkout --orphan api-dist
                      git rm -rf .
                    fi

                    # 5. Restaurer les données (le contenu de data/ à la racine)
                    cp -r /tmp/api_content/* .

                    # 6. Commit et Push
                    # git add -A est indispensable pour supprimer les fichiers disparus
                    git add -A
                    
                    if git diff --staged --quiet; then
                      echo "No actual changes to commit"
                    else
                      git commit -m "Update Game Master Data - $(date +'%Y-%m-%d %H:%M')"
                      git push origin api-dist
                    fi
                  else
                    echo "No changes in data folder."
                  fi
