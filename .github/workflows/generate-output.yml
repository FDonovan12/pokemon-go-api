name: Generate output

on:
    schedule:
        - cron: '0 */6 * * *'
    push:
        branches:
            - state
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout state
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 1. Décision : On utilise le hash du commit actuel et le timestamp distant
            - name: Check if generation is needed
              id: check
              run: |
                  REMOTE_TS=$(curl -s https://raw.githubusercontent.com/alexelgt/game_masters/refs/heads/master/timestamp.json | jq -r .uploadTime)
                  LAST_TS=$(jq -r .remoteTimestamp meta/generation.json || echo "0")

                  # On récupère le hash injecté par main lors de la synchro
                  CURRENT_HASH=$(cat main_source_hash.txt || echo "none")
                  LAST_HASH=$(jq -r .lastHash meta/generation.json || echo "none")

                  echo "remote_ts=$REMOTE_TS" >> $GITHUB_OUTPUT
                  echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT

                  if [ "$REMOTE_TS" != "$LAST_TS" ] || [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
                    echo "run=true" >> $GITHUB_OUTPUT
                  else
                    echo "run=false" >> $GITHUB_OUTPUT
                  fi

            # 2. Installation et Génération (Seulement si nécessaire)
            # On utilise SKIP_PREPARE ici pour éviter la double génération
            - name: Build and Generate
              if: steps.check.outputs.run == 'true'
              env:
                  SKIP_PREPARE: 'true'
              run: |
                  npm ci
                  npm run update

            # 3. Publication sur la branche 'output' (Méthode propre)
            - name: Deploy to output branch
              if: steps.check.outputs.run == 'true'
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: output
                  publish_dir: ./generated/data # Ton dossier de sortie
                  keep_files: false # On veut que output soit le reflet exact du dernier run

            # 4. Mise à jour de l'état sur 'state'
            - name: Update state metadata
              if: steps.check.outputs.run == 'true'
              run: |
                  jq -n \
                    --arg ts "${{ steps.check.outputs.remote_ts }}" \
                    --arg hash "${{ steps.check.outputs.current_hash }}" \
                    '{remoteTimestamp: $ts, lastHash: $hash}' > meta/generation.json

                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git add meta/generation.json
                  git commit -m "chore(state): update tracking [hash: ${{ steps.check.outputs.current_hash }}]"
                  git push origin state
